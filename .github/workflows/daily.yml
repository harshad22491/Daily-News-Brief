name: Daily edition
# Triggered at 07:15 IST (backup 07:55 IST) by an EXTERNAL scheduler — cron-job.org —
# calling GitHub's workflow_dispatch REST API; see trigger/ for equivalent cron /
# Task Scheduler callers. GitHub's own `schedule:` cron was dropped on 01-Sep-2026:
# it fired 1–12 h late every day that week (editions landed 08:36–19:13 IST instead
# of 08:00). Dispatched runs start within seconds. Being dispatch-only also exempts
# this workflow from GitHub's 60-day inactivity auto-disable.
# The backup dispatch is safe: pipeline.run exits early once today's editions are
# logged as sent/scheduled, and `concurrency` below serialises overlapping runs.
on:
  workflow_dispatch:
    inputs:
      dryrun:
        description: "Render but do not send (writes HTML artifacts)"
        type: boolean
        default: false

concurrency:
  group: daily-edition
  cancel-in-progress: false

jobs:
  build-and-send:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    env:
      SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
      SUPABASE_SERVICE_KEY: ${{ secrets.SUPABASE_SERVICE_KEY }}
      BREVO_API_KEY: ${{ secrets.BREVO_API_KEY }}
      SCRAPERAPI_KEY: ${{ secrets.SCRAPERAPI_KEY }}
      # Subscription auth. To switch Claude accounts: replace this one secret
      # (run `claude setup-token` under the other account). To switch to API
      # billing instead: set ANTHROPIC_API_KEY and clear CLAUDE_CODE_OAUTH_TOKEN.
      CLAUDE_CODE_OAUTH_TOKEN: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
      ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
      # To switch models: repo Settings → Variables → MODEL (e.g. opus | sonnet)
      MODEL: ${{ vars.MODEL || 'opus' }}
      RATE_BASE: ${{ vars.RATE_BASE }}   # Supabase edge function base URL
      SENDER_EMAIL: ${{ vars.SENDER_EMAIL }}           # Brevo-verified sender
      UNSUBSCRIBE_EMAIL: ${{ vars.SENDER_EMAIL }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: "3.11"}
      - uses: actions/setup-node@v4
        with: {node-version: "20"}
      - run: pip install -r requirements.txt
      - run: npm install -g @anthropic-ai/claude-code
      - name: Build and send (retries + partial-with-banner inside)
        run: python -m pipeline.run --mode daily ${{ inputs.dryrun && '--dryrun' || '' }}
      - name: Upload rendered editions
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: editions-${{ github.run_id }}
          path: work/**/*.html
          if-no-files-found: ignore
          retention-days: 14

  # Independent of briefing generation: reuse its external primary/backup triggers.
  radar-dispatch:
    if: ${{ !inputs.dryrun }}
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
    steps:
      - name: Start both Radar editions
        env:
          GH_TOKEN: ${{ secrets.RADAR_DISPATCH_TOKEN }}
        run: gh workflow run daily.yml --repo harshad22491/AI-Product-Radar
