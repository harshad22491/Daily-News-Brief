name: Deep-dive follow-up
on:
  workflow_dispatch:
    inputs:
      request_id:
        description: "followup_requests.id created by the consent edge function"
        required: true
        type: string

jobs:
  followup:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
      SUPABASE_SERVICE_KEY: ${{ secrets.SUPABASE_SERVICE_KEY }}
      BREVO_API_KEY: ${{ secrets.BREVO_API_KEY }}
      SCRAPERAPI_KEY: ${{ secrets.SCRAPERAPI_KEY }}
      CLAUDE_CODE_OAUTH_TOKEN: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
      ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
      MODEL: ${{ vars.MODEL || 'opus' }}
      SENDER_EMAIL: ${{ vars.SENDER_EMAIL }}
      UNSUBSCRIBE_EMAIL: ${{ vars.SENDER_EMAIL }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: "3.11"}
      - uses: actions/setup-node@v4
        with: {node-version: "20"}
      - run: pip install -r requirements.txt
      - run: npm install -g @anthropic-ai/claude-code
      - run: python -m pipeline.followup --request-id "${{ inputs.request_id }}"
