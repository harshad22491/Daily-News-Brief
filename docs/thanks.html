<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Daily News Briefing — Thanks</title>
<style>
  body { font-family: Georgia, serif; background:#fafaf7; color:#1a1a1a; margin:0;
         display:flex; min-height:100vh; align-items:center; justify-content:center; padding:1rem; }
  .card { background:#fff; border:1px solid #e4e2da; border-radius:10px; max-width:440px;
          padding:2rem 2.2rem; text-align:center; }
  h1 { font-size:1.3rem; margin:0 0 .4rem; }
  .stars { font-size:1.6rem; letter-spacing:.15em; }
  p { color:#555; line-height:1.5; }
  .btn { display:inline-block; background:#0a5c36; color:#fff; text-decoration:none;
         padding:.65rem 1.2rem; border-radius:6px; font-family:system-ui,sans-serif;
         font-size:.95rem; margin:.4rem .2rem; }
  .btn.ghost { background:transparent; color:#555; border:1px solid #ccc; }
  #offer { display:none; }
</style>
</head>
<body>
<div class="card">
  <h1>Thanks — rating recorded</h1>
  <div class="stars" id="stars"></div>
  <p id="msg">Your rating shapes tomorrow's edition.</p>
  <div id="offer">
    <p><strong>Want a deep dive or related coverage on this story?</strong></p>
    <a class="btn" id="yes" href="#">Yes — send it to my inbox</a>
    <a class="btn ghost" href="#" onclick="document.getElementById('offer').style.display='none';return false;">No thanks</a>
  </div>
</div>
<script>
  var q = new URLSearchParams(location.search);
  var s = Math.min(5, Math.max(0, parseInt(q.get("s") || "0", 10) || 0));
  document.getElementById("stars").textContent = "⭐".repeat(s) + "☆".repeat(5 - s);
  var req = q.get("req"), fn = q.get("fn");
  if (req && fn && /^https:\/\/[a-z0-9]+\.supabase\.co\/functions\/v1\/followup$/.test(fn)) {
    document.getElementById("yes").href = fn + "?req=" + encodeURIComponent(req) + "&go=1";
    document.getElementById("offer").style.display = "block";
  }
</script>
</body>
</html>
